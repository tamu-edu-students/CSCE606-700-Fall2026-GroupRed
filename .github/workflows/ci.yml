
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .ruby-version
          bundler-cache: true

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Verify Chrome
        run: google-chrome --version

      - name: Prepare database
        run: bin/rails db:prepare

      - name: Run RSpec (unit test coverage)
        run: COVERAGE_DIR=coverage/rspec bundle exec rspec

      - name: Run Cucumber (acceptance test coverage)
        run: COVERAGE_DIR=coverage/cucumber bundle exec cucumber

      - name: Run both suites (total coverage)
        run: |
          COVERAGE_DIR=coverage/total bundle exec rspec
          COVERAGE_DIR=coverage/total bundle exec cucumber

      - name: Check coverage is at least 90% (RSpec, Cucumber and total)
        run: |
          ruby -rjson -e '
            failed = false
            %w[rspec cucumber total].each do |suite|
              coverage = JSON.parse(File.read("coverage/#{suite}/.last_run.json"))["result"]["line"]
              puts "#{suite}: #{coverage}%"
              failed = true if coverage < 90
            end
            abort("Coverage is below 90%") if failed
          '

      - name: RuboCop
        run: bin/rubocop